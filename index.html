<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VALORANTのマップ情報をすばやく調べられるレスポンシブ攻略ガイド">
  <title>VALO MAP GUIDE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">V</div>
        <div><strong>VALO MAP</strong><span>FIELD GUIDE</span></div>
      </div>
      <button class="close-sidebar" id="closeSidebar" aria-label="サイドバーを閉じる">×</button>
      <nav>
        <a href="#home" class="side-link active" data-route="home">⌂ ホーム</a>
        <div class="nav-label">MAPS</div>
        <div id="sideMaps"></div>
      </nav>
      <div class="sidebar-bottom">
        <span class="status-dot"></span> MAP DATA / GUIDE
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="メニューを開く">☰</button>
        <div class="crumb" id="crumb">HOME</div>
        <div class="top-actions">
          <button class="icon-btn" id="searchBtn" aria-label="検索">⌕</button>
          <span class="version">V26</span>
        </div>
      </header>

      <section class="search-panel" id="searchPanel">
        <input id="searchInput" type="search" placeholder="マップ名・エリア名・役割で検索…">
      </section>

      <div id="appContent"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
